<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proyecto de Árbol Balanceado</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf2ff;background:#09111f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#15325a 0%,transparent 44%),#09111f;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:35px 20px 65px}h1{font-size:clamp(29px,5vw,46px);margin:0 0 24px}.card{background:#121f34;border:1px solid #29415f;border-radius:17px;padding:24px;margin-bottom:20px;box-shadow:0 12px 30px #0002}.controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap}label{display:flex;flex-direction:column;gap:8px;font-weight:600;color:#cbd8ee;flex:1;min-width:180px}input{border:1px solid #3a5878;background:#09182b;color:white;border-radius:10px;padding:13px 14px;font:inherit;width:100%}button{border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:750;cursor:pointer;background:#38bdf8;color:#06203a}button.secondary{background:#263d5b;color:#eaf2ff;border:1px solid #527198}button:hover{filter:brightness(1.12)}.visual{background:#eaf3ff;border-radius:12px;padding:12px;overflow:auto;min-height:200px}svg{display:block;height:auto;min-width:450px}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.result{border:1px solid #344a6a;background:#1b2b45;border-radius:12px;padding:14px;overflow-wrap:anywhere}.result b{color:#7dd3fc;display:block;margin-bottom:8px}.status{margin-top:13px;min-height:22px;color:#a9b9d3}.error{color:#ff9c9c}.success{color:#9bf5b8}.hint{color:#a9b9d3;font-size:13px;line-height:1.5}.choices{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.choices button{background:#203a5c;color:#eaf2ff;border:1px solid #527198}.choices button.active{background:#38bdf8;color:#06203a}.hidden{display:none}#routeResult{background:#1b2b45;border:1px solid #344a6a;border-radius:12px;padding:15px;min-height:50px}@media(max-width:650px){.results{grid-template-columns:1fr}.card{padding:17px}.wrap{padding:23px 12px}}
</style>
</head>
<body><main class="wrap">
<h1>Proyecto de Árbol Balanceado AVL</h1>
<section class="card"><div class="controls"><label>Número entero<input id="nums" type="number" step="1" placeholder="" autocomplete="off"></label><button id="add">Agregar número</button><button class="secondary" id="reset">Limpiar árbol</button></div><div id="status" class="status" role="status" aria-live="polite"></div></section>
<section class="card"><h2>Árbol generado</h2><div id="treeVisual" class="visual" aria-label="Grafo del árbol binario"></div><div class="results"><div class="result"><b>Raíz actual</b><span id="rootValue">—</span></div><div class="result"><b>Altura (niveles)</b><span id="heightValue">0</span></div><div class="result"><b>Estado del equilibrio</b><span id="balanceValue">Sin nodos</span></div><div class="result"><b>Último balanceo</b><span id="rotationValue">Sin rotaciones</span></div></div><p class="hint" id="balanceDetail">El algoritmo AVL mantiene la diferencia de alturas entre -1 y 1 mediante rotaciones.</p></section>
<section class="card"><button id="routesToggle" aria-expanded="false" aria-controls="routesPanel">Recorridos ▾</button><div id="routesPanel" class="hidden"><div class="choices"><button data-route="pre">Preorden</button><button data-route="in">Inorden</button><button data-route="post">Postorden</button></div><div id="routeResult" aria-live="polite">Selecciona un recorrido.</div></div></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
let root=null,selectedRoute=null,rotationLog=[];
function node(value){return {v:value,l:null,r:null,h:1};}
function height(n){return n?n.h:0;}
function updateHeight(n){n.h=1+Math.max(height(n.l),height(n.r));}
function factor(n){return height(n.l)-height(n.r);}
function rotateRight(y){const x=y.l, middle=x.r;x.r=y;y.l=middle;updateHeight(y);updateHeight(x);return x;}
function rotateLeft(x){const y=x.r,middle=y.l;y.l=x;x.r=middle;updateHeight(x);updateHeight(y);return y;}
function insertAVL(n,value){
  if(!n)return node(value);
  if(value<n.v)n.l=insertAVL(n.l,value);
  else if(value>n.v)n.r=insertAVL(n.r,value);
  else throw Error('Ese número ya existe en el árbol.');
  updateHeight(n);
  const fe=factor(n);
  if(fe>1 && value<n.l.v){rotationLog.push('Rotación derecha (LL) en '+n.v);return rotateRight(n);}
  if(fe< -1 && value>n.r.v){rotationLog.push('Rotación izquierda (RR) en '+n.v);return rotateLeft(n);}
  if(fe>1 && value>n.l.v){rotationLog.push('Rotación izquierda-derecha (LR) en '+n.v);n.l=rotateLeft(n.l);return rotateRight(n);}
  if(fe< -1 && value<n.r.v){rotationLog.push('Rotación derecha-izquierda (RL) en '+n.v);n.r=rotateRight(n.r);return rotateLeft(n);}
  return n;
}
function analyze(n){if(!n)return {height:0,balanced:true,bad:[]};const a=analyze(n.l),b=analyze(n.r),fe=a.height-b.height;return {height:Math.max(a.height,b.height)+1,balanced:a.balanced&&b.balanced&&Math.abs(fe)<=1,bad:[...a.bad,...b.bad,...(Math.abs(fe)>1?[`${n.v} (FE: ${fe})`]:[])]};}
function walk(n,type,out){if(!n)return;if(type==='pre')out.push(n.v);walk(n.l,type,out);if(type==='in')out.push(n.v);walk(n.r,type,out);if(type==='post')out.push(n.v);}
function el(tag,attrs={},content){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(content!==undefined)e.textContent=content;return e;}
function drawTree(){const target=$('treeVisual');if(!root){target.textContent='Agrega un número para visualizar el árbol.';return;}let order=0,maxDepth=0;const nodes=[],edges=[];function layout(n,depth,parent){if(!n)return;layout(n.l,depth+1,n);n.x=55+order++*75;n.y=50+depth*90;maxDepth=Math.max(maxDepth,depth);nodes.push(n);if(parent)edges.push([parent,n]);layout(n.r,depth+1,n);}layout(root,0,null);const w=Math.max(500,order*75+40),h=Math.max(200,(maxDepth+1)*90+20);const svg=el('svg',{viewBox:`0 0 ${w} ${h}`,width:w,role:'img','aria-label':'Árbol AVL con raíz actual '+root.v});for(const [a,b] of edges)svg.append(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#64748b','stroke-width':2.5}));for(const n of nodes){svg.append(el('circle',{cx:n.x,cy:n.y,r:24,fill:n===root?'#15803d':'#2563eb',stroke:'#fff','stroke-width':2}));svg.append(el('text',{x:n.x,y:n.y+5,'text-anchor':'middle','font-size':15,'font-weight':700,fill:'white'},n.v));}target.replaceChildren(svg);}
function showRoute(type){selectedRoute=type;document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===type));const out=[];walk(root,type,out);const names={pre:'Preorden',in:'Inorden',post:'Postorden'};$('routeResult').textContent=`${names[type]}: ${out.length?out.join(' → '):'Árbol vacío'}`;}
function refresh(){drawTree();const a=analyze(root);$('rootValue').textContent=root?root.v:'—';$('heightValue').textContent=a.height;$('balanceValue').textContent=!root?'Sin nodos':a.balanced?'BALANCEADO':'NO BALANCEADO';$('balanceValue').style.color=!root?'':a.balanced?'#9bf5b8':'#ff9c9c';$('balanceDetail').textContent=!root?'El algoritmo AVL mantiene el árbol balanceado automáticamente.':a.balanced?'Todos los nodos cumplen el criterio de equilibrio (FE entre -1 y 1).':'Se detectó un desequilibrio en: '+a.bad.join(', ')+'.';$('rotationValue').textContent=rotationLog.length?rotationLog.join(' · '):'Sin rotaciones';if(selectedRoute)showRoute(selectedRoute);}
$('add').addEventListener('click',()=>{const raw=$('nums').value.trim();const value=Number(raw);if(!/^[-+]?\d+$/.test(raw)||!Number.isSafeInteger(value)){$('status').textContent='Ingresa un número entero válido.';$('status').className='status error';return;}rotationLog=[];try{root=insertAVL(root,value);}catch(e){$('status').textContent=e.message;$('status').className='status error';return;}$('status').textContent=`Número ${value} agregado. `+(rotationLog.length?'AVL balanceado mediante rotación.':'Sin rotaciones necesarias.');$('status').className='status success';$('nums').value='';$('nums').focus();refresh();});
$('nums').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click();});
$('reset').addEventListener('click',()=>{root=null;selectedRoute=null;rotationLog=[];$('nums').value='';$('status').textContent='Árbol limpiado.';$('status').className='status success';$('routeResult').textContent='Selecciona un recorrido.';document.querySelectorAll('[data-route]').forEach(b=>b.classList.remove('active'));refresh();});
$('routesToggle').addEventListener('click',()=>{const panel=$('routesPanel');const open=panel.classList.toggle('hidden')===false;$('routesToggle').setAttribute('aria-expanded',String(open));$('routesToggle').textContent=open?'Recorridos ▴':'Recorridos ▾';});
document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>showRoute(b.dataset.route)));
refresh();
</script>
</body></html>
